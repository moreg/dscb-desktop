name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate tag version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$releaseVersion") {
            throw "Tag must match package.json version: v$releaseVersion"
          }
      - run: npm ci
      - run: npm run typecheck:node
      - run: npm run typecheck:web
      - run: npx vitest run tests/app-updates.test.ts
      - run: npm run build
      - name: Build installer and update metadata
        run: npx electron-builder --win --x64 --publish never
      - name: Upload files to one draft release
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release" }
          }
          $releaseFiles = @(
            "release/dscb-desktop-setup-$((Get-Content package.json -Raw | ConvertFrom-Json).version)-x64.exe",
            "release/dscb-desktop-setup-$((Get-Content package.json -Raw | ConvertFrom-Json).version)-x64.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($releaseFile in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $releaseFile)) { throw "Missing release file: $releaseFile" }
          }
          gh release upload $env:GITHUB_REF_NAME @releaseFiles --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release files" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
